name: Build macOS installer (.pkg)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.0)"
        default: "1.0.0"
        required: true
      server_url:
        description: "Portal URL written into the installed config"
        default: "https://portal.compliancegenie.cloudservesystems.com"
        required: true

jobs:
  build-pkg:
    runs-on: macos-14
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the agent files are there
        run: |
          ls -l dist/compliancegenie-agent dist/config.json packaging/macos/com.compliancegenie.agent.plist
          lipo -archs dist/compliancegenie-agent

      - name: Build the .pkg
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: bash packaging/macos/pkg/build-pkg.sh "${{ inputs.version }}"

      - name: Upload the .pkg
        uses: actions/upload-artifact@v4
        with:
          name: ComplianceGenie-Agent-${{ inputs.version }}-macOS-pkg
          path: packaging/macos/pkg/out/*.pkg
          if-no-files-found: error

